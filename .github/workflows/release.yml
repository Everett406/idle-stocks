name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Show Flutter / Java versions
        run: |
          flutter --version
          java -version

      - name: pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Read & verify version
        id: version
        run: |
          set -e
          TAG=${GITHUB_REF_NAME}
          VERSION_FROM_FILE=$(tr -d '[:space:]' < version.txt)
          TAG_STRIPPED=${TAG#v}
          if [ "$VERSION_FROM_FILE" != "$TAG_STRIPPED" ]; then
            echo "::error::version.txt (${VERSION_FROM_FILE}) does not match tag ${TAG} (${TAG_STRIPPED})"
            exit 1
          fi
          echo "version=${VERSION_FROM_FILE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        if: ${{ github.event_name == 'push' }}
        run: |
          set -e
          mkdir -p android/app
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/app/key.jks
          ls -la android/app/key.jks

      - name: Write key.properties
        if: ${{ github.event_name == 'push' }}
        run: |
          set -e
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          cat android/key.properties

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.version }} \
            --build-number=${GITHUB_RUN_NUMBER} \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          files: build/app/outputs/flutter-apk/app-release.apk
          body_path: docs/releases/${{ steps.version.outputs.tag }}.md
          fail_on_unmatched_files: false